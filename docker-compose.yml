services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerpay
      POSTGRES_PASSWORD: ledgerpay
      POSTGRES_DB: ledgerpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerpay -d ledgerpay"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/code
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: